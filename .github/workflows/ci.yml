name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # No browser is needed: everything covered here is pure logic. The
      # provider adapters are exercised against the live sites by hand, because
      # a mock of a UI that changes weekly proves nothing.
      - run: npm run typecheck
      - run: npm test
